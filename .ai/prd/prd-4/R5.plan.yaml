# R5.plan.yaml
title: 学员统计展示
prd_ref: prd-4.R5
created: 2026-08-10

steps:
  - id: A-1
    executor: agent
    file: public/inspire/student.js
    action: 学员详情每任务最佳成绩旁显示等级徽章；计算距下一档差距（minScore - 得分 或 maxTime - 用时），已达最高档显示「已达最高」
    verify: node --check public/inspire/student.js
    expect: 无输出（通过）
    history: []

  - id: A-2
    executor: agent
    file: public/inspire/stats.html
    action: 统计页按任务汇总各等级人数 + 达标率
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

test_strategy:
  auto:
    - node --check student.js
    - stats.html 内联脚本校验
  manual:
    - 学员详情显示等级与差距（差几分/几秒）
    - 统计页达标率正确
    - 无梯度任务显示「未设梯度」

not_doing:
  - 不动学员成绩录入（stu_tool）

boundary:
  constraints: 复用 R2 判定函数，只做展示
  depends_on: R2（判定）、R4（覆盖数据）
