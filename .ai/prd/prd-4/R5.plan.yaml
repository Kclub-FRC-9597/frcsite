# R5.plan.yaml
title: 学员达标展示
prd_ref: prd-4.R5
created: 2026-08-10

steps:
  - id: A-1
    executor: agent
    file: public/inspire/student.js
    action: 学员详情每任务最佳成绩旁显示达标徽章；未达标显示差距（还差几秒或未满分提示）
    verify: node --check public/inspire/student.js
    expect: 无输出（通过）
    history: []

  - id: A-2
    executor: agent
    file: public/inspire/stats.html
    action: 统计页按任务汇总达标人数 + 达标率
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

test_strategy:
  auto:
    - node --check student.js
    - stats.html 内联脚本校验
  manual:
    - 学员详情显示达标与差距（差几秒）
    - 统计页达标率正确
    - 无区间任务显示「未设目标」

not_doing:
  - 不动学员成绩录入（stu_tool）

boundary:
  constraints: 复用 R2 判定函数，只做展示
  depends_on: R2（判定）、R4（覆盖数据）
