# R3.plan.yaml
title: 任务用时配置
prd_ref: prd-4.R3
created: 2026-08-10

steps:
  # ── agent 自动执行阶段 ──────────────────────────────────
  - id: A-1
    phase: auto
    executor: agent
    file: public/inspire/tasks.html
    action: 任务表单增加「目标档位」区：渲染 task.goalTimes 已有值（时间档位列表，支持增删）
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-2
    phase: auto
    executor: agent
    file: public/inspire/tasks.html
    action: 保存任务时收集档位列表写入 task.goalTimes（未配置 = 不写入该字段）；编辑任务时回填
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  # ── 手动测试阶段（GATE 3） ──────────────────────────────
  - id: M-1
    phase: manual
    executor: human
    instructions:
      - 任务管理新建任务，添加目标档位 100/80/70（秒）→ 保存
      - 刷新页面，确认档位列表保留
      - 编辑任务增删/改档位 → 保存
    pass_criteria: 目标档位列表保存后刷新保留；编辑即时生效；不配档位的任务不写入 goalTimes
    signal: 反馈「GATE 3 通过」
    history: []

  # ── 收尾阶段（冻结） ────────────────────────────────────
  - id: W-1
    phase: auto
    executor: agent
    action: 整理本次实现的 API 文档（task.goalTimes 档位列表结构、任务表单字段）
    expect: API 文档已更新到对应位置
    history: []

  - id: W-2
    phase: auto
    executor: agent
    action: 更新 R3.md front matter 中 status.implement = done
    expect: R3.md status.implement 已变为 done
    history: []

  - id: W-3
    phase: auto
    executor: agent
    action: 将 R3.plan.yaml 重命名为 R3.plan_done.yaml
    expect: R3.plan_done.yaml 文件存在
    history: []

  - id: W-4
    phase: auto
    executor: agent
    action: 将 R3.md 重命名为 R3_done.md
    expect: R3_done.md 文件存在
    history: []

test_strategy:
  auto:
    - tasks.html 内联脚本校验
  manual:
    - 新建任务设目标档位（如 100/80/70s）→ 保存 → 刷新保留
    - 编辑任务增删/改档位 → 保存生效
    - 不配档位的任务不写入 goalTimes，不影响其它

not_doing:
  - 不在本页做达标判定/徽章（那是 R4/R5）

boundary:
  constraints: 复用现有任务 CRUD 与 localStorage 保存路径
  depends_on: R2（字段结构）
