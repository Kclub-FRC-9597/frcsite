# R3.plan.yaml
title: 任务用时配置
prd_ref: prd-4.R3
created: 2026-08-10

steps:
  - id: A-1
    executor: agent
    file: public/inspire/tasks.html
    action: 任务表单增加「满分用时目标」区：渲染 task.goalTimeRange 已有值（上限必填、下限可留空）
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-2
    executor: agent
    file: public/inspire/tasks.html
    action: 保存任务时收集用时区间写入 task.goalTimeRange（未配置 = 不写入该字段）；编辑任务时回填
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

test_strategy:
  auto:
    - tasks.html 内联脚本校验
  manual:
    - 新建任务设用时区间（如 上限 12s）→ 保存 → 刷新保留
    - 编辑任务改区间 → 保存生效
    - 不配区间的任务不写入 goalTimeRange，不影响其它

not_doing:
  - 不在本页做达标判定/徽章（那是 R4/R5）

boundary:
  constraints: 复用现有任务 CRUD 与 localStorage 保存路径
  depends_on: R2（字段结构）
