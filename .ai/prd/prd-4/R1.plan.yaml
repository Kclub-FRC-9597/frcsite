# R1.plan.yaml
title: 移除目标设定
prd_ref: prd-4.R1
created: 2026-08-10

steps:
  # ── agent 自动执行阶段 ──────────────────────────────────
  - id: A-1
    phase: auto
    executor: agent
    file: public/inspire/training.html
    action: 删除下拉 `<option value="goal">🎯 目标设定</option>`；confirmMockModal 还原为 `name = competitionType === 'official' ? '正赛' : '第' + (training.mockCompetitions.length + 1) + '轮'`；addMockCompetition `compCount` 改回 `training.mockCompetitions.length` 并删注释；renderTrainingList `statMocks` 改回 `t.mockCompetitions`（删过滤/注释/占位 else）；renderStudentDetail `chartRecords` 改回 `training.mockCompetitions`、删两处 `isStatCounted` 跳过
    verify: node 内联脚本校验（<script> 无 src 块逐个 new Function）
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-2
    phase: auto
    executor: agent
    file: public/inspire/shared.js
    action: getMockTypeText/Label/Bg 去掉 goal 分支；删除 isStatCounted 方法
    verify: node --check public/inspire/shared.js
    expect: 无输出（通过）
    history: []

  - id: A-3
    phase: auto
    executor: agent
    file: public/inspire/student.js
    action: 删除 `if (mockSource === 'goal') return; // 目标设定不计入成绩统计`
    verify: node --check public/inspire/student.js
    expect: 无输出（通过）
    history: []

  - id: A-4
    phase: auto
    executor: agent
    file: public/inspire/stats.html
    action: 删除 `if (Shared.getMockType(m) === 'goal') return; // 目标设定不计入成绩统计`
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-5
    phase: auto
    executor: agent
    file: public/inspire/changelog.js
    action: 删除 2026-08-10「记录类型新增目标设定」条目
    verify: node --check public/inspire/changelog.js
    expect: 无输出（通过）
    history: []

  # ── 手动测试阶段（GATE 1） ──────────────────────────────
  - id: M-1
    phase: manual
    executor: human
    instructions:
      - 刷新 training.html，新增记录展开「记录类型」下拉
      - 名称留空新增一条模拟赛
      - 打开含「无任务但有成绩」记录的集训、学员详情、统计页、导出 CSV
    pass_criteria: 下拉只剩 模拟赛/正赛；默认名「第N轮」且编号不被目标设定占用；__default__ 兜底生效；无 goal 残留
    signal: 反馈「GATE 1 通过」
    history: []

  # ── 收尾阶段（冻结） ────────────────────────────────────
  - id: W-1
    phase: auto
    executor: agent
    action: 整理本次实现的 API 文档（Shared.getMockType* 签名、移除项说明）
    expect: API 文档已更新到对应位置
    history: []

  - id: W-2
    phase: auto
    executor: agent
    action: 更新 R1.md front matter 中 status.implement = done
    expect: R1.md status.implement 已变为 done
    history: []

  - id: W-3
    phase: auto
    executor: agent
    action: 将 R1.plan.yaml 重命名为 R1.plan_done.yaml
    expect: R1.plan_done.yaml 文件存在
    history: []

  - id: W-4
    phase: auto
    executor: agent
    action: 将 R1.md 重命名为 R1_done.md
    expect: R1_done.md 文件存在
    history: []

test_strategy:
  auto:
    - node --check shared.js / student.js / changelog.js
    - training.html / stats.html 内联脚本块校验
  manual:
    - 新增记录下拉只剩 模拟赛/正赛
    - 清空名称新增模拟赛 → 默认「第N轮」，编号不被目标设定占用
    - 无任务记录（默认任务 __default__）仍进最佳成绩概览
    - 学员详情 / 统计页 / CSV 导出回归正常

not_doing:
  - 不清理已建的 goal 历史记录（保留在 localStorage）
  - 不做任务满分用时目标（那是 R2~R5）

boundary:
  constraints: 只删 goal 相关行；保留 __default__ 兜底与 getMockType* 重构
  depends_on: P0① git 安全点提交（已完成 46389d3）
