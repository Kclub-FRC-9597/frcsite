# R4.plan.yaml
title: 集训达标展示
prd_ref: prd-4.R4
created: 2026-08-10

steps:
  - id: A-1
    executor: agent
    file: public/inspire/training.html
    action: 在 renderTrainingList 最佳成绩概览中，为每个学员×任务用 Shared.evaluateTimeGoal 判定达标，best-of 单元格旁渲染 ✅/✗ 徽章；未配置区间不显示
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-2
    executor: agent
    file: public/inspire/training.html
    action: 概览区增加达标人数 + 达标率汇总行
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-3
    executor: agent
    file: public/inspire/training.html
    action: 新增学员「调整目标」弹窗：选择学员+任务，编辑用时区间；保存写入 training.studentGoals；未设置 = 走任务默认
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

test_strategy:
  auto:
    - training.html 内联脚本校验
    - 注入测试数据验证徽章/达标率/覆盖计算
  manual:
    - 有区间任务：最佳成绩旁显示达标徽章，概览汇总正确
    - 学员覆盖后仅该学员按专属区间判定
    - 无区间任务不显示徽章

not_doing:
  - 不动成绩录入/赛程/CSV 导出

boundary:
  constraints: 复用现有 best-of 概览逻辑，只叠加展示
  depends_on: R2（判定）、R3（任务配置了区间才有数据）
