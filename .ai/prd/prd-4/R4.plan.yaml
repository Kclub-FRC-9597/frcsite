# R4.plan.yaml
title: 集训达标展示
prd_ref: prd-4.R4
created: 2026-08-10

steps:
  # ── agent 自动执行阶段 ──────────────────────────────────
  - id: A-1
    phase: auto
    executor: agent
    file: public/inspire/training.html
    action: 在每个学员最佳成绩单元格内、最佳值下方显示「当前目标」：用 Shared.getGoalTimes 取有效档位（覆盖优先），用 Shared.currentGoal(bestFullScoreTime, goalTimes) 计算下一档并渲染（无满分→最松档，全达成→「已达全部目标」，未配置→—）
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-2
    phase: auto
    executor: agent
    file: public/inspire/training.html
    action: 达标徽章：取该学员该任务满分成绩中最短用时 bestFullScoreTime，用 Shared.isGoalAchieved(bestFullScoreTime, 当前目标档) 判定并渲染 ✅/✗；未配置档位不显示
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  - id: A-3
    phase: auto
    executor: agent
    file: public/inspire/training.html
    action: 新增学员「调整目标」弹窗：选择学员+任务，编辑目标档位列表；保存写入 training.studentGoals；未设置 = 走任务默认
    verify: node 内联脚本校验
    expect: ALL INLINE SCRIPTS OK
    history: []

  # ── 手动测试阶段（GATE 4 · R4 部分） ────────────────────
  - id: M-1
    phase: manual
    executor: human
    instructions:
      - 集训详情概览：确认每个学员最佳值下方显示「当前目标」（如 best 75s → 70s）
      - 确认最佳成绩旁有达标徽章 ✅/✗
      - 对某学员点「调整目标」设置覆盖档位，刷新确认
    pass_criteria: 当前目标（下一档，覆盖优先）正确；达标徽章正确；学员覆盖仅影响该学员且刷新保留；无档位任务不显示徽章/目标
    signal: 反馈「GATE 4（R4）通过」
    history: []

  # ── 收尾阶段（冻结） ────────────────────────────────────
  - id: W-1
    phase: auto
    executor: agent
    action: 整理本次实现的 API 文档（概览渲染逻辑、studentGoals 写入接口）
    expect: API 文档已更新到对应位置
    history: []

  - id: W-2
    phase: auto
    executor: agent
    action: 更新 R4.md front matter 中 status.implement = done
    expect: R4.md status.implement 已变为 done
    history: []

  - id: W-3
    phase: auto
    executor: agent
    action: 将 R4.plan.yaml 重命名为 R4.plan_done.yaml
    expect: R4.plan_done.yaml 文件存在
    history: []

  - id: W-4
    phase: auto
    executor: agent
    action: 将 R4.md 重命名为 R4_done.md
    expect: R4_done.md 文件存在
    history: []

test_strategy:
  auto:
    - training.html 内联脚本校验
    - 注入测试数据验证当前目标/达标徽章/覆盖计算
  manual:
    - 有档位任务：最佳值下方显示「当前目标」，最佳成绩旁有达标徽章
    - 学员覆盖后仅该学员按专属档位判定
    - 无档位任务不显示徽章/目标

not_doing:
  - 不动成绩录入/赛程/CSV 导出

boundary:
  constraints: 复用现有 best-of 概览逻辑，只叠加展示；仅基于模拟赛/正赛（见总纲数据边界）
  depends_on: R2（判定）、R3（任务配置了区间才有数据）
