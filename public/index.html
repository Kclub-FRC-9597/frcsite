<body>
    <div id="app"></div>

    <script>
        window.toggleMobileSidebar = function () {
            var sidebar = document.getElementById("accountSidebar");
            if (!sidebar) sidebar = document.getElementById("toolsSidebar");
            if (!sidebar) sidebar = document.getElementById("seasonsSidebar");
            if (sidebar) sidebar.classList.toggle("active");
        };

        window.addEventListener("hashchange", window.renderApp);
        window.addEventListener("load", function () {
            window.renderApp();
            var hash = window.location.hash;
            if (hash === "#tools/prescouting" || hash === "#tools") {
                setTimeout(renderEntries, 500);
            }
        });
        window.addEventListener("hashchange", function () {
